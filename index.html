<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>低價商品雷達</title>
<style>
:root{--bg:#f5f7f5;--panel:#fff;--text:#18201a;--muted:#6d756f;--line:#dfe6e0;--brand:#183a28;--soft:#edf1ee;--hot:#fff1cc;--hottext:#765500;--wait:#eaf1ff;--waittext:#365c91;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:18px;margin-bottom:22px}.hero-main{background:var(--brand);color:#f7fff9;border-radius:26px;padding:28px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.78}h1{font-size:clamp(30px,5vw,48px);margin:8px 0 10px}.lead{margin:0;color:#dcebe0;line-height:1.65}.hero-stat,.summary-card,.card,.modal{background:var(--panel);border:1px solid var(--line)}.hero-stat{border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:center}.hero-stat strong{font-size:38px}.hero-stat span,.summary-card small{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,button{min-height:46px;border-radius:14px;border:1px solid #d8dfda;background:#fff;color:inherit;padding:0 14px;font-size:16px}input{flex:1 1 260px}select{flex:0 1 190px}button{cursor:pointer;font-weight:800}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.secondary{background:var(--soft)}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.summary-card{border-radius:18px;padding:17px}.summary-card small{display:block;margin-bottom:6px}.summary-card b{font-size:22px}.grid{display:flex;flex-direction:column;gap:10px}.card{border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:minmax(240px,2.2fr) minmax(150px,.9fr) minmax(300px,1.7fr) auto;grid-template-areas:"top price meta actions" "name price meta actions";column-gap:18px;row-gap:5px;align-items:center}.card-top{grid-area:top;display:flex;align-items:center;gap:10px}.store{font-size:12px;font-weight:800;letter-spacing:.08em;color:#66736a}.badge{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:var(--soft);margin-left:auto}.badge.hot{background:var(--hot);color:var(--hottext)}.badge.wait{background:var(--wait);color:var(--waittext)}.name{grid-area:name;font-size:18px;font-weight:800;line-height:1.35}.price-row{grid-area:price;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.price{font-size:26px;font-weight:900;white-space:nowrap}.old{text-decoration:line-through;color:#8a938d;font-size:14px}.discount{font-size:12px;font-weight:800;color:#9a6500}.meta{grid-area:meta;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.meta div{background:#f5f7f5;border-radius:10px;padding:9px 10px;min-width:0}.meta small{display:block;color:#747d77;font-size:10px;white-space:nowrap}.meta b{display:block;margin-top:2px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{grid-area:actions;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions a,.actions button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:0 13px;text-decoration:none;font-weight:800;white-space:nowrap}.actions a{background:var(--brand);color:#fff}.actions .delete-btn{background:transparent;color:var(--danger);border:1px solid #e3aaa5}.note{margin-top:18px;padding:16px 18px;border-radius:17px;background:#e9eee9;color:#4f5b53;font-size:13px;line-height:1.6}.empty{display:none;text-align:center;padding:36px;background:#fff;border-radius:20px;border:1px dashed #ccd5ce}.empty.show{display:block}footer{color:#7a847d;text-align:center;font-size:12px;margin-top:22px}.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.dialog-backdrop.show{display:flex}.modal{width:min(640px,100%);border-radius:22px;padding:22px;max-height:90vh;overflow:auto}.modal.small{width:min(480px,100%)}.modal h2{margin:0 0 6px}.modal p{margin:0 0 18px;color:var(--muted);font-size:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;flex:none}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.form-msg{margin-top:12px;font-size:13px;color:var(--muted)}.form-msg.ok{color:#19733b}.form-msg.err{color:#b3261e}.delete-name{font-weight:900;font-size:18px;margin:12px 0}.warning{background:#fff4f2;border:1px solid #ffd0ca;border-radius:12px;padding:12px;color:#8d241a;font-size:13px}@media(max-width:980px){.card{grid-template-columns:1.5fr .8fr;grid-template-areas:"top price" "name price" "meta meta" "actions actions"}.meta{margin-top:8px}.actions{margin-top:5px;justify-content:flex-start}}@media(max-width:760px){.wrap{padding:16px}.hero,.summary,.form-grid{grid-template-columns:1fr}.toolbar>*{flex:1 1 100%}.field.full{grid-column:auto}.card{grid-template-columns:1fr;grid-template-areas:"top" "name" "price" "meta" "actions"}.meta{grid-template-columns:1fr}.actions a,.actions button{width:100%}}@media(prefers-color-scheme:dark){:root{--bg:#111713;--panel:#1b211d;--text:#eef5ef;--muted:#aab6ad;--line:#303832;--brand:#1a442d;--soft:#252c27;--hot:#463818;--hottext:#ffd76a;--wait:#24344d;--waittext:#b9d2ff}input,select,button{background:#171c18;border-color:#39433c}.meta div{background:#222923}.note{background:#1c241e;color:#bdc7bf}}
</style></head><body><main class="wrap">
<section class="hero"><div class="hero-main"><div class="eyebrow">AUTO PRICE WATCH · TAIWAN</div><h1>低價商品雷達</h1><p class="lead">每天自動查價、保存價格歷史，接近觀測歷史低點或出現大幅折扣時標示 🔥值得買。</p></div><div class="hero-stat"><strong id="visibleCount">–</strong><span>項商品顯示中</span></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜尋商品，例如：糙米、漱口水…"><select id="store"><option value="all">所有商店</option><option value="costco">好市多 Costco</option><option value="wanjiafu">萬家福</option><option value="custom">其他／自訂</option></select><select id="status"><option value="all">所有狀態（值得買優先）</option><option value="hot">🔥 值得買</option><option value="watch">持續觀察</option><option value="waiting">等待首次查價</option></select><select id="sort"><option value="price-asc">價格：低到高</option><option value="price-desc">價格：高到低</option></select><button id="addBtn" class="primary" type="button">＋ 新增商品</button></div>
<section class="summary"><div class="summary-card"><small>追蹤商店</small><b id="storeCount">–</b></div><div class="summary-card"><small>🔥 值得買</small><b id="hotCount">–</b></div><div class="summary-card"><small>判斷門檻</small><b>歷史低價 +5%</b></div><div class="summary-card"><small>最後更新</small><b id="updatedAt" style="font-size:16px">讀取中…</b></div></section>
<section id="grid" class="grid"></section><div id="empty" class="empty">找不到符合條件的追蹤商品。</div><div class="note"><b>商品管理：</b>新增後立即顯示；不想追蹤的商品可按「刪除追蹤」，並需再次確認及輸入管理密碼。</div><footer>低價商品雷達 · v2026.08.23-4</footer></main>
<div id="dialog" class="dialog-backdrop"><form id="productForm" class="modal"><h2>新增追蹤商品</h2><p>輸入管理密碼後，商品會直接加入每日查價清單。</p><div class="form-grid"><div class="field"><label for="fStore">商店</label><select id="fStore" required><option value="costco">好市多 Costco</option><option value="wanjiafu">萬家福</option><option value="custom">其他／自訂</option></select></div><div class="field"><label for="fStoreName">商店名稱</label><input id="fStoreName" value="COSTCO 好市多"></div><div class="field full"><label for="fName">商品名稱與規格</label><input id="fName" required></div><div class="field full"><label for="fUrl">商品直接網址</label><input id="fUrl" type="url" required placeholder="https://..."></div><div class="field"><label for="fPrice">目前價格（NT$，可不填）</label><input id="fPrice" type="number" min="0" step="0.01"></div><div class="field"><label for="fOldPrice">原價／平常價（可不填）</label><input id="fOldPrice" type="number" min="0" step="0.01"></div><div class="field full"><label for="fAdminKey">管理密碼</label><input id="fAdminKey" type="password" required autocomplete="current-password"></div></div><div id="formMsg" class="form-msg"></div><div class="dialog-actions"><button id="cancelBtn" type="button" class="secondary">取消</button><button id="submitBtn" type="submit" class="primary">加入每日追蹤</button></div></form></div>
<div id="deleteDialog" class="dialog-backdrop"><form id="deleteForm" class="modal small"><h2>確認刪除追蹤？</h2><p>你即將停止追蹤：</p><div id="deleteName" class="delete-name"></div><div class="warning">刪除後，此商品將不再進行每日查價。這個動作需要再次按「確認刪除」。</div><div class="field full" style="margin-top:14px"><label for="deleteAdminKey">管理密碼</label><input id="deleteAdminKey" type="password" required autocomplete="current-password"></div><div id="deleteMsg" class="form-msg"></div><div class="dialog-actions"><button id="deleteCancel" type="button" class="secondary">返回</button><button id="deleteConfirm" type="submit" class="danger">確認刪除</button></div></form></div>
<script>
const API='https://low-price-radar-api.blueccret.workers.dev',CONFIG='products.json';const $=s=>document.querySelector(s),grid=$('#grid'),search=$('#search'),store=$('#store'),status=$('#status'),sort=$('#sort'),empty=$('#empty'),count=$('#visibleCount'),hotCount=$('#hotCount'),updatedAt=$('#updatedAt'),storeCount=$('#storeCount'),dialog=$('#dialog'),form=$('#productForm'),msg=$('#formMsg'),submitBtn=$('#submitBtn'),deleteDialog=$('#deleteDialog'),deleteForm=$('#deleteForm'),deleteMsg=$('#deleteMsg'),deleteConfirm=$('#deleteConfirm');let products=[],deleteTarget=null;const money=v=>v==null?'—':'NT$'+Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
function state(p){if(p.waiting)return'waiting';return p.hot===true?'hot':'watch'}
function card(p){const s=state(p),hot=s==='hot',wait=s==='waiting',disc=!wait&&p.discount_pct!=null?`<span class="discount">${p.discount_pct}% OFF</span>`:'',old=!wait&&p.old_price?`<span class="old">${money(p.old_price)}</span>`:'';const label=wait?'⏳ 等待首次查價':hot?'🔥 值得買':'持續觀察';return `<article class="card"><div class="card-top"><span class="store">${p.store_name||'其他商店'}</span><span class="badge ${hot?'hot':wait?'wait':''}">${label}</span></div><div class="name">${p.name}</div><div class="price-row"><span class="price">${wait&&p.price==null?'等待查價':money(p.price)}</span>${old}${disc}</div><div class="meta"><div><small>觀測歷史低價</small><b>${wait?'—':money(p.history_low)}</b></div><div><small>歷史資料</small><b>${wait?'0 筆':(p.history_points||0)+' 筆'}</b></div><div><small>判斷</small><b>${wait?'等待首次自動查價':(p.reason||'持續觀察')}</b></div></div><div class="actions"><a href="${p.url}" target="_blank" rel="noopener">直接商品頁 ↗</a><button class="delete-btn" type="button" data-id="${String(p.id||'').replace(/"/g,'&quot;')}">刪除追蹤</button></div></article>`}
function render(){let list=products.filter(p=>(!search.value.trim()||(p.name||'').toLowerCase().includes(search.value.trim().toLowerCase()))&&(store.value==='all'||p.store===store.value)&&(status.value==='all'||state(p)===status.value));list.sort((a,b)=>{const rank=x=>state(x)==='hot'?0:state(x)==='watch'?1:2,d=rank(a)-rank(b);if(d)return d;const ap=a.price==null?Infinity:Number(a.price),bp=b.price==null?Infinity:Number(b.price);return sort.value==='price-desc'?bp-ap:ap-bp});grid.innerHTML=list.map(card).join('');grid.querySelectorAll('.delete-btn').forEach(btn=>btn.onclick=()=>openDelete(btn.dataset.id));count.textContent=list.length;hotCount.textContent=products.filter(p=>p.hot===true&&!p.waiting).length;storeCount.textContent=new Set(products.map(p=>p.store_name).filter(Boolean)).size+' 家';empty.classList.toggle('show',!list.length)}
async function reload(){try{const [latestRes,configRes]=await Promise.all([fetch('data/latest.json?ts='+Date.now()),fetch(CONFIG+'?ts='+Date.now())]);const latest=latestRes.ok?await latestRes.json():{products:[]},config=configRes.ok?await configRes.json():{products:[]},configured=config.products||[],allowedIds=new Set(configured.map(p=>p.id)),allowedUrls=new Set(configured.map(p=>p.url));const done=(latest.products||[]).filter(p=>allowedIds.has(p.id)||allowedUrls.has(p.url)),ids=new Set(done.map(p=>p.id)),urls=new Set(done.map(p=>p.url));const waiting=configured.filter(p=>!ids.has(p.id)&&!urls.has(p.url)).map(p=>({id:p.id,store:p.store,store_name:p.store_name,name:p.name,url:p.url,price:p.fallback_price??null,history_low:null,history_points:0,hot:false,waiting:true,reason:'等待首次自動查價'}));products=[...done,...waiting];updatedAt.textContent=latest.updated_at?new Date(latest.updated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'等待首次更新';render()}catch(e){updatedAt.textContent='讀取失敗'}}
function openDelete(id){deleteTarget=products.find(p=>String(p.id)===String(id));if(!deleteTarget)return;$('#deleteName').textContent=deleteTarget.name;$('#deleteAdminKey').value='';deleteMsg.textContent='';deleteMsg.className='form-msg';deleteDialog.classList.add('show')}
[search,store,status,sort].forEach(el=>el.addEventListener(el===search?'input':'change',render));$('#addBtn').onclick=()=>{form.reset();$('#fStoreName').value='COSTCO 好市多';msg.textContent='';msg.className='form-msg';dialog.classList.add('show')};$('#cancelBtn').onclick=()=>dialog.classList.remove('show');$('#fStore').onchange=e=>{$('#fStoreName').value=e.target.value==='costco'?'COSTCO 好市多':e.target.value==='wanjiafu'?'萬家福':''};form.onsubmit=async e=>{e.preventDefault();submitBtn.disabled=true;msg.textContent='送出中…';msg.className='form-msg';const body={action:'add',store:$('#fStore').value,store_name:$('#fStoreName').value.trim()||'其他商店',name:$('#fName').value.trim(),url:$('#fUrl').value.trim(),price:$('#fPrice').value,old_price:$('#fOldPrice').value};try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('#fAdminKey').value},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.message||'新增失敗');await reload();msg.textContent='✓ 已加入每日追蹤';msg.className='form-msg ok';setTimeout(()=>dialog.classList.remove('show'),1200)}catch(err){msg.textContent='新增失敗：'+err.message;msg.className='form-msg err'}finally{submitBtn.disabled=false}};
$('#deleteCancel').onclick=()=>deleteDialog.classList.remove('show');deleteForm.onsubmit=async e=>{e.preventDefault();if(!deleteTarget)return;deleteConfirm.disabled=true;deleteMsg.textContent='刪除中…';deleteMsg.className='form-msg';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('#deleteAdminKey').value},body:JSON.stringify({action:'delete',id:deleteTarget.id,url:deleteTarget.url,name:deleteTarget.name})}),data=await r.json();if(!r.ok)throw Error(data.message||'刪除失敗');products=products.filter(p=>p.id!==deleteTarget.id);render();deleteMsg.textContent='✓ 已停止追蹤';deleteMsg.className='form-msg ok';setTimeout(()=>{deleteDialog.classList.remove('show');deleteTarget=null},900)}catch(err){deleteMsg.textContent='刪除失敗：'+err.message;deleteMsg.className='form-msg err'}finally{deleteConfirm.disabled=false}};reload();
</script></body></html>
