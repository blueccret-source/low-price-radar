<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>低價商品雷達</title>
<style>
:root{--bg:#f5f7f5;--panel:#fff;--text:#18201a;--muted:#6d756f;--line:#dfe6e0;--brand:#183a28;--soft:#edf1ee;--hot:#fff1cc;--hottext:#765500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:18px;margin-bottom:22px}.hero-main{background:var(--brand);color:#f7fff9;border-radius:26px;padding:28px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.78}h1{font-size:clamp(30px,5vw,48px);margin:8px 0 10px}.lead{margin:0;color:#dcebe0;line-height:1.65}.hero-stat,.summary-card,.card,.modal{background:var(--panel);border:1px solid var(--line)}.hero-stat{border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:center}.hero-stat strong{font-size:38px}.hero-stat span,.summary-card small{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,button{min-height:46px;border-radius:14px;border:1px solid #d8dfda;background:#fff;color:inherit;padding:0 14px;font-size:16px}input{flex:1 1 260px}select{flex:0 1 190px}button{cursor:pointer;font-weight:800}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.secondary{background:var(--soft)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.summary-card{border-radius:18px;padding:17px}.summary-card small{display:block;margin-bottom:6px}.summary-card b{font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border-radius:22px;padding:20px;display:flex;flex-direction:column}.card-top{display:flex;justify-content:space-between;gap:12px}.store{font-size:12px;font-weight:800;letter-spacing:.08em;color:#66736a}.badge{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:var(--soft)}.badge.hot{background:var(--hot);color:var(--hottext)}.badge.local{background:#e7eef9;color:#315a8c}.name{font-size:19px;font-weight:800;line-height:1.35;margin:9px 0 14px}.price-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}.price{font-size:31px;font-weight:900}.old{text-decoration:line-through;color:#8a938d}.discount{font-size:13px;font-weight:800;color:#9a6500}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.meta div{background:#f5f7f5;border-radius:12px;padding:10px 12px}.meta small{display:block;color:#747d77;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.actions a,.actions button{min-height:44px;display:inline-flex;align-items:center;border-radius:13px;padding:0 14px;text-decoration:none;font-weight:800}.actions a{background:var(--brand);color:#fff}.note{margin-top:18px;padding:16px 18px;border-radius:17px;background:#e9eee9;color:#4f5b53;font-size:13px;line-height:1.6}.hidden{display:none!important}.empty{display:none;text-align:center;padding:36px;background:#fff;border-radius:20px;border:1px dashed #ccd5ce}.empty.show{display:block}footer{color:#7a847d;text-align:center;font-size:12px;margin-top:22px}.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.dialog-backdrop.show{display:flex}.modal{width:min(640px,100%);border-radius:22px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 6px}.modal p{margin:0 0 18px;color:var(--muted);font-size:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;flex:none}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.form-msg{margin-top:12px;font-size:13px;color:var(--muted)}@media(max-width:760px){.wrap{padding:16px}.hero,.summary,.grid,.form-grid{grid-template-columns:1fr}.toolbar>*{flex:1 1 100%}.field.full{grid-column:auto}}@media(prefers-color-scheme:dark){:root{--bg:#111713;--panel:#1b211d;--text:#eef5ef;--muted:#aab6ad;--line:#303832;--brand:#1a442d;--soft:#252c27;--hot:#463818;--hottext:#ffd76a}input,select,button{background:#171c18;border-color:#39433c}.primary{background:var(--brand)}.meta div{background:#222923}.note{background:#1c241e;color:#bdc7bf}.empty{background:#191f1b;border-color:#3b463e}}
</style>
</head><body><main class="wrap">
<section class="hero"><div class="hero-main"><div class="eyebrow">AUTO PRICE WATCH · TAIWAN</div><h1>低價商品雷達</h1><p class="lead">每天自動查價、保存價格歷史，接近觀測歷史低點或出現大幅折扣時標示 🔥值得買。</p></div><div class="hero-stat"><strong id="visibleCount">–</strong><span>項商品顯示中</span></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜尋商品，例如：糙米、漱口水…"><select id="store"><option value="all">所有商店</option><option value="costco">好市多 Costco</option><option value="wanjiafu">萬家福</option><option value="custom">其他／自訂</option></select><select id="status"><option value="all">所有狀態</option><option value="hot">🔥 值得買</option><option value="watch">持續觀察</option></select><select id="sort"><option value="default">預設排序</option><option value="price-asc">價格：低到高</option><option value="price-desc">價格：高到低</option></select><button id="addBtn" class="primary" type="button">＋ 新增商品</button></div>
<section class="summary"><div class="summary-card"><small>追蹤商店</small><b id="storeCount">2 家</b></div><div class="summary-card"><small>🔥 值得買</small><b id="hotCount">–</b></div><div class="summary-card"><small>判斷門檻</small><b>歷史低價 +5%</b></div><div class="summary-card"><small>最後更新</small><b id="updatedAt" style="font-size:16px">讀取中…</b></div></section>
<section id="grid" class="grid"></section><div id="empty" class="empty">找不到符合條件的追蹤商品。</div>
<div class="note"><b>新增商品說明：</b>你從網站新增的商品會先保存在這台裝置的瀏覽器中，立即出現在清單，但目前不會自動寫入 GitHub 的每日查價程式。也就是說，它是「待加入自動追蹤」項目；真正每日查價仍以 GitHub 的 products.json 為準。</div>
<footer>低價商品雷達 · 每日自動查價</footer></main>

<div id="dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><form id="productForm" class="modal"><h2 id="dialogTitle">新增追蹤商品</h2><p>填入商品資料後會先加入這台裝置的清單。</p><div class="form-grid">
<div class="field"><label for="fStore">商店</label><select id="fStore" required><option value="costco">好市多 Costco</option><option value="wanjiafu">萬家福</option><option value="custom">其他／自訂</option></select></div>
<div class="field"><label for="fStoreName">商店名稱</label><input id="fStoreName" placeholder="例如：家樂福"></div>
<div class="field full"><label for="fName">商品名稱與規格</label><input id="fName" required placeholder="例如：某品牌 有機糙米 2kg"></div>
<div class="field full"><label for="fUrl">商品直接網址</label><input id="fUrl" type="url" required placeholder="https://..."></div>
<div class="field"><label for="fPrice">目前價格（NT$）</label><input id="fPrice" type="number" min="0" step="0.01" placeholder="199"></div>
<div class="field"><label for="fUnitLabel">單位</label><input id="fUnitLabel" placeholder="例如：kg、L、包"></div>
<div class="field"><label for="fUnitPrice">單位價格（NT$）</label><input id="fUnitPrice" type="number" min="0" step="0.01" placeholder="99.5"></div>
<div class="field"><label for="fOldPrice">原價／平常價（選填）</label><input id="fOldPrice" type="number" min="0" step="0.01"></div>
</div><div id="formMsg" class="form-msg"></div><div class="dialog-actions"><button id="cancelBtn" type="button" class="secondary">取消</button><button type="submit" class="primary">新增到清單</button></div></form></div>
<script>
const $=s=>document.querySelector(s),grid=$('#grid'),search=$('#search'),store=$('#store'),status=$('#status'),sort=$('#sort'),empty=$('#empty'),count=$('#visibleCount'),hotCount=$('#hotCount'),updatedAt=$('#updatedAt'),storeCount=$('#storeCount'),dialog=$('#dialog'),form=$('#productForm');let remoteProducts=[],localProducts=[];
const money=v=>v==null||v===''?'—':'NT$'+Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
function loadLocal(){try{localProducts=JSON.parse(localStorage.getItem('lowPriceRadarLocalProducts')||'[]')}catch{localProducts=[]}}
function saveLocal(){localStorage.setItem('lowPriceRadarLocalProducts',JSON.stringify(localProducts))}
function card(p){const hot=p.hot===true,disc=p.discount_pct!=null?`<span class="discount">${p.discount_pct}% OFF</span>`:'',old=p.old_price?`<span class="old">${money(p.old_price)}</span>`:'',local=p.local===true;return `<article class="card" data-store="${p.store}" data-status="${hot?'hot':'watch'}" data-price="${p.price||0}" data-name="${(p.name||'').toLowerCase()}"><div class="card-top"><span class="store">${p.store_name}</span><span class="badge ${hot?'hot':local?'local':''}">${hot?'🔥 值得買':local?'待加入自動追蹤':'持續觀察'}</span></div><div class="name">${p.name}</div><div class="price-row"><span class="price">${money(p.price)}</span>${old}${disc}</div><div class="meta"><div><small>單位價格</small><b>${p.unit_price!=null&&p.unit_price!==''?money(p.unit_price)+' / '+(p.unit_label||'單位'):'—'}</b></div><div><small>觀測歷史低價</small><b>${money(p.history_low)}</b></div><div><small>歷史資料</small><b>${p.history_points||0} 筆</b></div><div><small>判斷</small><b>${p.reason||'持續觀察'}</b></div></div><div class="actions"><a href="${p.url}" target="_blank" rel="noopener">直接商品頁 ↗</a>${local?`<button type="button" class="secondary remove-local" data-id="${p.id}">移除</button>`:''}</div></article>`}
function allProducts(){return [...remoteProducts,...localProducts]}
function render(){let products=allProducts(),list=products.filter(p=>(!search.value.trim()||(p.name||'').toLowerCase().includes(search.value.trim().toLowerCase()))&&(store.value==='all'||p.store===store.value)&&(status.value==='all'||(p.hot?'hot':'watch')===status.value));if(sort.value==='price-asc')list.sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));if(sort.value==='price-desc')list.sort((a,b)=>(b.price||0)-(a.price||0));grid.innerHTML=list.map(card).join('');count.textContent=list.length;hotCount.textContent=products.filter(p=>p.hot).length;const stores=new Set(products.map(p=>p.store_name).filter(Boolean));storeCount.textContent=stores.size+' 家';empty.classList.toggle('show',!list.length);grid.querySelectorAll('.remove-local').forEach(b=>b.addEventListener('click',()=>{localProducts=localProducts.filter(p=>p.id!==b.dataset.id);saveLocal();render()}))}
[search,store,status,sort].forEach(el=>el.addEventListener(el===search?'input':'change',render));
$('#addBtn').addEventListener('click',()=>{form.reset();$('#formMsg').textContent='';dialog.classList.add('show');$('#fName').focus()});
$('#cancelBtn').addEventListener('click',()=>dialog.classList.remove('show'));dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.classList.remove('show')});
$('#fStore').addEventListener('change',e=>{if(e.target.value==='costco')$('#fStoreName').value='COSTCO 好市多';else if(e.target.value==='wanjiafu')$('#fStoreName').value='萬家福';else $('#fStoreName').value=''});
form.addEventListener('submit',e=>{e.preventDefault();const storeVal=$('#fStore').value,name=$('#fName').value.trim(),url=$('#fUrl').value.trim();if(!name||!url){$('#formMsg').textContent='請填商品名稱與網址。';return}let parsed;try{parsed=new URL(url);if(!/^https?:$/.test(parsed.protocol))throw Error()}catch{$('#formMsg').textContent='商品網址格式不正確。';return}const price=$('#fPrice').value===''?null:Number($('#fPrice').value),old=$('#fOldPrice').value===''?null:Number($('#fOldPrice').value),unitPrice=$('#fUnitPrice').value===''?null:Number($('#fUnitPrice').value);const storeName=$('#fStoreName').value.trim()||(storeVal==='costco'?'COSTCO 好市多':storeVal==='wanjiafu'?'萬家福':'其他商店');let discount=null;if(price!=null&&old&&old>price)discount=Math.round((1-price/old)*1000)/10;const p={id:'local-'+Date.now(),local:true,store:storeVal,store_name:storeName,name,url,price,old_price:old,unit_price:unitPrice,unit_label:$('#fUnitLabel').value.trim(),history_low:null,history_points:0,discount_pct:discount,hot:discount!=null&&discount>=20,reason:discount!=null&&discount>=20?'明顯折扣（本機新增）':'待加入每日自動查價'};localProducts.push(p);saveLocal();dialog.classList.remove('show');render()});
loadLocal();render();fetch('data/latest.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{remoteProducts=d.products||[];updatedAt.textContent=new Date(d.updated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});render()}).catch(e=>{updatedAt.textContent='讀取失敗';console.error(e)});
</script></body></html>
