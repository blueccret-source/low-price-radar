<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>低價商品雷達</title>
<style>
:root{--bg:#f5f7f5;--panel:#fff;--text:#18201a;--muted:#6d756f;--line:#dfe6e0;--brand:#183a28;--soft:#edf1ee;--hot:#fff1cc;--hottext:#765500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:18px;margin-bottom:22px}.hero-main{background:var(--brand);color:#f7fff9;border-radius:26px;padding:28px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.78}h1{font-size:clamp(30px,5vw,48px);margin:8px 0 10px}.lead{margin:0;color:#dcebe0;line-height:1.65}.hero-stat,.summary-card,.card{background:var(--panel);border:1px solid var(--line)}.hero-stat{border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:center}.hero-stat strong{font-size:38px}.hero-stat span,.summary-card small{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{min-height:46px;border-radius:14px;border:1px solid #d8dfda;background:#fff;color:inherit;padding:0 14px;font-size:16px}input{flex:1 1 260px}select{flex:0 1 190px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.summary-card{border-radius:18px;padding:17px}.summary-card small{display:block;margin-bottom:6px}.summary-card b{font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border-radius:22px;padding:20px;display:flex;flex-direction:column}.card-top{display:flex;justify-content:space-between;gap:12px}.store{font-size:12px;font-weight:800;letter-spacing:.08em;color:#66736a}.badge{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:var(--soft)}.badge.hot{background:var(--hot);color:var(--hottext)}.name{font-size:19px;font-weight:800;line-height:1.35;margin:9px 0 14px}.price-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}.price{font-size:31px;font-weight:900}.old{text-decoration:line-through;color:#8a938d}.discount{font-size:13px;font-weight:800;color:#9a6500}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.meta div{background:#f5f7f5;border-radius:12px;padding:10px 12px}.meta small{display:block;color:#747d77;font-size:11px}.actions{margin-top:auto}.actions a{min-height:44px;display:inline-flex;align-items:center;border-radius:13px;padding:0 14px;text-decoration:none;font-weight:800;background:var(--brand);color:#fff}.note{margin-top:18px;padding:16px 18px;border-radius:17px;background:#e9eee9;color:#4f5b53;font-size:13px;line-height:1.6}.hidden{display:none!important}.empty{display:none;text-align:center;padding:36px;background:#fff;border-radius:20px;border:1px dashed #ccd5ce}.empty.show{display:block}footer{color:#7a847d;text-align:center;font-size:12px;margin-top:22px}@media(max-width:760px){.wrap{padding:16px}.hero,.summary,.grid{grid-template-columns:1fr}.toolbar>*{flex:1 1 100%}}@media(prefers-color-scheme:dark){:root{--bg:#111713;--panel:#1b211d;--text:#eef5ef;--muted:#aab6ad;--line:#303832;--brand:#1a442d;--soft:#252c27;--hot:#463818;--hottext:#ffd76a}input,select{background:#171c18;border-color:#39433c}.meta div{background:#222923}.note{background:#1c241e;color:#bdc7bf}.empty{background:#191f1b;border-color:#3b463e}}
</style>
</head><body><main class="wrap">
<section class="hero"><div class="hero-main"><div class="eyebrow">AUTO PRICE WATCH · TAIWAN</div><h1>低價商品雷達</h1><p class="lead">每天自動查價、保存價格歷史，接近觀測歷史低點或出現大幅折扣時標示 🔥值得買。</p></div><div class="hero-stat"><strong id="visibleCount">–</strong><span>項指定商品追蹤中</span></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜尋商品，例如：糙米、漱口水…"><select id="store"><option value="all">所有商店</option><option value="costco">好市多 Costco</option><option value="wanjiafu">萬家福</option></select><select id="status"><option value="all">所有狀態</option><option value="hot">🔥 值得買</option><option value="watch">持續觀察</option></select><select id="sort"><option value="default">預設排序</option><option value="price-asc">價格：低到高</option><option value="price-desc">價格：高到低</option></select></div>
<section class="summary"><div class="summary-card"><small>追蹤商店</small><b>2 家</b></div><div class="summary-card"><small>🔥 值得買</small><b id="hotCount">–</b></div><div class="summary-card"><small>判斷門檻</small><b>歷史低價 +5%</b></div><div class="summary-card"><small>最後更新</small><b id="updatedAt" style="font-size:16px">讀取中…</b></div></section>
<section id="grid" class="grid"></section><div id="empty" class="empty">找不到符合條件的追蹤商品。</div>
<div class="note"><b>自動化說明：</b>價格由 GitHub Actions 每天更新。歷史資料不足 3 筆前，不會因「今天剛好最低」而誤亮 🔥；若頁面本身能辨識到 20% 以上明顯折扣，仍會立即標示。若商店阻擋自動抓價，該商品會保留最近基準價並繼續嘗試。</div>
<footer>低價商品雷達 · 每日自動查價</footer></main>
<script>
const $=s=>document.querySelector(s),grid=$('#grid'),search=$('#search'),store=$('#store'),status=$('#status'),sort=$('#sort'),empty=$('#empty'),count=$('#visibleCount'),hotCount=$('#hotCount'),updatedAt=$('#updatedAt');let products=[];
const money=v=>v==null?'—':'NT$'+Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
function card(p){const hot=p.hot===true,disc=p.discount_pct!=null?`<span class="discount">${p.discount_pct}% OFF</span>`:'',old=p.old_price?`<span class="old">${money(p.old_price)}</span>`:'';return `<article class="card" data-store="${p.store}" data-status="${hot?'hot':'watch'}" data-price="${p.price||0}" data-name="${p.name.toLowerCase()}"><div class="card-top"><span class="store">${p.store_name}</span><span class="badge ${hot?'hot':''}">${hot?'🔥 值得買':'持續觀察'}</span></div><div class="name">${p.name}</div><div class="price-row"><span class="price">${money(p.price)}</span>${old}${disc}</div><div class="meta"><div><small>單位價格</small><b>${p.unit_price!=null?money(p.unit_price)+' / '+p.unit_label:'—'}</b></div><div><small>觀測歷史低價</small><b>${money(p.history_low)}</b></div><div><small>歷史資料</small><b>${p.history_points||0} 筆</b></div><div><small>判斷</small><b>${p.reason||'持續觀察'}</b></div></div><div class="actions"><a href="${p.url}" target="_blank" rel="noopener">直接商品頁 ↗</a></div></article>`}
function render(){let list=products.filter(p=>(!search.value.trim()||p.name.toLowerCase().includes(search.value.trim().toLowerCase()))&&(store.value==='all'||p.store===store.value)&&(status.value==='all'||(p.hot?'hot':'watch')===status.value));if(sort.value==='price-asc')list.sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));if(sort.value==='price-desc')list.sort((a,b)=>(b.price||0)-(a.price||0));grid.innerHTML=list.map(card).join('');count.textContent=list.length;empty.classList.toggle('show',!list.length)}
[search,store,status,sort].forEach(el=>el.addEventListener(el===search?'input':'change',render));
fetch('data/latest.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{products=d.products||[];hotCount.textContent=products.filter(p=>p.hot).length;updatedAt.textContent=new Date(d.updated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});render()}).catch(e=>{updatedAt.textContent='讀取失敗';grid.innerHTML='<div class="note">暫時無法讀取最新價格資料，請稍後重新整理。</div>';console.error(e)});
</script></body></html>
